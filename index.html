<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cherry Clock V4.4</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; filter: brightness(0.4); }
        
        #clock-display { 
            font-size: 130px; 
            color: #FFB7C5; 
            font-weight: bold; 
            text-shadow: 0 0 45px rgba(255, 183, 197, 0.7); 
            margin-bottom: 30px; 
            z-index: 10; 
            display: flex; 
            align-items: baseline; 
        }
        
        #seconds-display { 
            font-size: 50px; 
            margin-left: 15px; 
            opacity: 0.8; 
            font-weight: normal; 
        }

        .search-area { background: rgba(255, 255, 255, 0.98); border-radius: 50px; padding: 15px 30px; width: 550px; display: flex; margin-bottom: 40px; z-index: 10; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
        .search-area input { border: none; outline: none; width: 100%; font-size: 18px; color: #000; background: transparent; }
        .shortcut-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; z-index: 10; }
        .box { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); padding: 18px; border-radius: 20px; color: white; text-decoration: none; text-align: center; font-size: 14px; width: 120px; border: 1px solid rgba(255, 183, 197, 0.3); transition: 0.3s; }
        .box:hover { background: #FFB7C5; color: #000; transform: translateY(-8px); }
        #ver { position: fixed; bottom: 15px; right: 25px; font-size: 13px; opacity: 0.7; font-weight: bold; }
    </style>
</head>
<body>
    <video autoplay muted loop id="bg-video"><source src="arkaplan.mp4" type="video/mp4"></video>
    
    <div id="clock-display">
        <span id="hm-display">Loading...</span>
        <span id="seconds-display">00</span>
    </div>

    <div class="search-area">
        <form action="https://www.google.com/search" method="GET" style="width:100%"><input type="text" name="q" placeholder="Search Google..." autofocus autocomplete="off"></form>
    </div>
    
    </div>
    <div id="ver">Cherry Clock V4.7 🍒</div>
    <script src="script.js"></script>
</body>
</html>
